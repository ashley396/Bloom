<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2">
  <meta name="description" content="Create your Florisyn account — 14-day free trial for independent florists.">
  <title>Create account | Florisyn</title>
  <link rel="icon" href="/assets/florisyn/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/florisyn/florisyn-mark.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/bloom-auth.css">
  <link rel="stylesheet" href="/florisyn-brand.css">
  <link rel="stylesheet" href="/florisyn-founder-1.0.css">
</head>
<body class="bloom-auth florisyn">
  <header class="bloom-auth-top">
    <a class="bloom-auth-brand" href="/login">
      <img src="/assets/florisyn/florisyn-mark.svg" width="44" height="44" alt="">
      <span><strong>Florisyn</strong><small>The Operating System for Modern Florists</small></span>
    </a>
    <nav class="bloom-auth-nav"><a href="/login">Sign in</a></nav>
  </header>
  <main class="bloom-auth-signup-shell">
    <section class="bloom-auth-visual">
      <img src="/assets/auth/luxury-florist-workspace.jpg" alt="Luxury floral design workspace" width="1600" height="1067" loading="lazy">
      <div class="bloom-auth-visual-copy">
        <p class="eyebrow">14-day free trial</p>
        <h1>Create your Florisyn account</h1>
        <p>No setup fee · No contract · Florist-first from day one.</p>
      </div>
    </section>
    <div class="bloom-auth-signup-main">
      <form id="signupForm">
        <section class="bloom-auth-plans" id="pricing" aria-label="Choose a plan">
          <label class="bloom-auth-plan"><input type="radio" name="plan" value="starter" data-price="39"><h3>Starter</h3><strong>$39<small>/mo</small></strong><p>Essential POS, orders, and inventory.</p></label>
          <label class="bloom-auth-plan"><span class="popular">Popular</span><input type="radio" name="plan" value="pro" data-price="79" checked><h3>Pro</h3><strong>$79<small>/mo</small></strong><p>Reporting, deliveries, Lily &amp; Rose.</p></label>
          <label class="bloom-auth-plan"><input type="radio" name="plan" value="premium" data-price="129"><h3>Premium</h3><strong>$129<small>/mo</small></strong><p>Multi-store, wholesale, priority support.</p></label>
        </section>
        <div class="bloom-auth-card" style="width:100%;max-width:none">
          <p class="eyebrow">Your shop</p>
          <h2>Tell us about your flower shop</h2>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px">
            <label>Your full name<input id="fullName" required autocomplete="name"></label>
            <label>Flower shop name<input id="shopName" required autocomplete="organization"></label>
            <label>Business email<input id="email" type="email" required autocomplete="email"></label>
            <label>Phone<input id="businessPhone" type="tel" required autocomplete="tel"></label>
            <label>Password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label>
            <label>Business type<select id="businessType"><option>Retail flower shop</option><option>Event florist</option><option>Wedding florist</option><option>Home-based florist</option><option>Other</option></select></label>
          </div>
          <label>Street address<input id="businessAddress" required autocomplete="street-address"></label>
          <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px">
            <label>City<input id="businessCity" required></label>
            <label>State<input id="businessState" required maxlength="2" placeholder="KY"></label>
            <label>ZIP<input id="businessZip" required inputmode="numeric"></label>
          </div>
          <label class="check" style="flex-direction:row;align-items:flex-start;gap:10px;font-weight:500"><input id="agreeTerms" type="checkbox" required><span>I agree to the <a href="/legal/terms/" target="_blank" rel="noopener">Terms</a> and <a href="/legal/privacy/" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>
          <button type="submit" class="bloom-auth-btn">Start my free trial</button>
          <p id="signupMessage" class="bloom-auth-message" aria-live="polite"></p>
          <p class="bloom-auth-links"><a href="/login">Already have an account? Sign in</a></p>
        </div>
      </form>
    </div>
  </main>
  <footer class="bloom-auth-footer">© <span data-current-year></span> Florisyn Technologies</footer>
  <script src="/signup.js" type="module"></script>
  <script src="/bloom-auth-common.js" defer></script>
</body>
</html>
